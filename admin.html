<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Teeth Street Dental Clinic</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/buttons.css">
  <link rel="stylesheet" href="css/booking.css">
</head>
<body>

  <!-- LOGIN -->
  <main class="page-narrow" id="loginView">
    <a href="index.html" class="back-link">&larr; Back to Home</a>

    <div class="admin-login">
      <h1 class="section-title">Admin Login</h1>
      <p class="section-subtitle" style="margin-bottom:24px;">For clinic staff only.</p>

      <div class="booking-card">
        <form class="booking-form" id="loginForm">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" required>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" required>
          </div>
          <div class="form-message" id="loginMessage"></div>
          <button type="submit" class="btn btn-filled">Log In</button>
        </form>
      </div>
      <p class="section-subtitle" style="margin-top:16px;"></p>
    </div>
  </main>

  <!-- DASHBOARD -->
  <main class="page-wide" id="dashboardView" style="display:none;">
    <div class="admin-bar">
      <div>
        <h1 class="section-title" style="text-align:left; margin-bottom:4px;">Bookings</h1>
        <p class="section-subtitle" style="text-align:left; margin-bottom:0;" id="countText"></p>
      </div>
      <button type="button" class="btn btn-outline" id="logoutBtn">Log Out</button>
    </div>

    <div class="table-wrap">
      <table class="bookings-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Phone</th>
            <th>Email</th>
            <th>Service</th>
            <th>Date</th>
            <th>Time</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="bookingsBody"></tbody>
      </table>
      <div class="empty-state" id="emptyState" style="display:none;">No bookings yet.</div>
    </div>
  </main>

  <script>
    var ADMIN_USER = 'admin';
    var ADMIN_PASS = 'admin';

    var loginView = document.getElementById('loginView');
    var dashboardView = document.getElementById('dashboardView');
    var loginForm = document.getElementById('loginForm');
    var loginMessage = document.getElementById('loginMessage');
    var bodyEl = document.getElementById('bookingsBody');
    var emptyState = document.getElementById('emptyState');
    var countText = document.getElementById('countText');

    function getBookings() {
      try {
        return JSON.parse(localStorage.getItem('bookings')) || [];
      } catch (err) {
        return [];
      }
    }

    function saveBookings(list) {
      localStorage.setItem('bookings', JSON.stringify(list));
    }

    function escapeHtml(text) {
      var div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function render() {
      var bookings = getBookings();
      bodyEl.innerHTML = '';

      countText.textContent = bookings.length + ' total booking(s)';
      emptyState.style.display = bookings.length === 0 ? 'block' : 'none';

      bookings.forEach(function (b) {
        var isConfirmed = b.status === 'Confirmed';
        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td>' + escapeHtml(b.name) + '</td>' +
          '<td>' + escapeHtml(b.phone) + '</td>' +
          '<td>' + escapeHtml(b.email) + '</td>' +
          '<td>' + escapeHtml(b.service) + '</td>' +
          '<td>' + escapeHtml(b.date) + '</td>' +
          '<td>' + escapeHtml(b.time) + '</td>' +
          '<td><span class="status ' + (isConfirmed ? 'confirmed' : 'pending') + '">' + escapeHtml(b.status) + '</span></td>' +
          '<td>' +
            (isConfirmed ? '' : '<button class="action-btn" data-action="confirm" data-id="' + b.id + '">Confirm</button>') +
            '<button class="action-btn danger" data-action="delete" data-id="' + b.id + '">Delete</button>' +
          '</td>';
        bodyEl.appendChild(tr);
      });
    }

    function showDashboard() {
      loginView.style.display = 'none';
      dashboardView.style.display = 'block';
      render();
    }

    function showLogin() {
      dashboardView.style.display = 'none';
      loginView.style.display = 'block';
    }

    loginForm.addEventListener('submit', function (e) {
      e.preventDefault();
      var user = document.getElementById('username').value.trim();
      var pass = document.getElementById('password').value;

      if (user === ADMIN_USER && pass === ADMIN_PASS) {
        sessionStorage.setItem('isAdmin', 'yes');
        loginMessage.className = 'form-message';
        loginForm.reset();
        showDashboard();
      } else {
        loginMessage.className = 'form-message error';
        loginMessage.textContent = 'Wrong username or password.';
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', function () {
      sessionStorage.removeItem('isAdmin');
      showLogin();
    });

    bodyEl.addEventListener('click', function (e) {
      var btn = e.target.closest('button[data-action]');
      if (!btn) return;

      var id = Number(btn.getAttribute('data-id'));
      var action = btn.getAttribute('data-action');
      var bookings = getBookings();

      if (action === 'confirm') {
        bookings.forEach(function (b) {
          if (b.id === id) b.status = 'Confirmed';
        });
        saveBookings(bookings);
      } else if (action === 'delete') {
        if (!confirm('Delete this booking?')) return;
        bookings = bookings.filter(function (b) { return b.id !== id; });
        saveBookings(bookings);
      }
      render();
    });

    // If still logged in during this session
    if (sessionStorage.getItem('isAdmin') === 'yes') {
      showDashboard();
    }
  </script>

</body>
</html>
